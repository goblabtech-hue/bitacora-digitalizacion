# Despliegue en Fly.io.
# Dallas ('dfw') es la región disponible más cercana a México; Fly ya no
# ofrece Querétaro.
app = "cts-bitacora"
primary_region = "dfw"

[build]
  dockerfile = "Dockerfile"

# La base y los respaldos viven aquí; sin este volumen se perderían
# en cada despliegue.
[[mounts]]
  source = "datos"
  destination = "/datos"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/salud"

# Una sola máquina, siempre. SQLite vive en un disco que no se comparte entre
# máquinas: si Fly levanta dos, cada una vería una base distinta. Tras el primer
# despliegue conviene fijarlo con:  fly scale count 1
[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
