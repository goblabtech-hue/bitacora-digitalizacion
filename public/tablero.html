<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Estado de sus documentos</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body class="tablero-body">

<main class="tablero" id="tablero" hidden>
  <header class="tablero-cab">
    <div>
      <h1 id="t-dependencia"></h1>
      <p class="sub" id="t-sub"></p>
    </div>
  </header>

  <div class="stats" id="t-stats"></div>

  <div class="card">
    <div class="card-head">
      <h2>Sus entregas</h2>
      <span class="sub" id="t-actualizado"></span>
    </div>
    <div class="card-body no-pad" id="t-lotes"></div>
  </div>

  <p class="tablero-pie" id="t-pie"></p>
</main>

<div class="acceso" id="t-error" hidden>
  <div class="acceso-caja">
    <h1>Enlace no disponible</h1>
    <p id="t-error-texto">Este enlace no es válido o fue revocado. Solicita uno nuevo a quien te lo compartió.</p>
  </div>
</div>

<script src="/tablero.js"></script>
</body>
</html>
